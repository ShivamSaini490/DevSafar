[project]
name = "devsafar-backend"
version = "0.1.0"
description = "Foundation API for the DevSafar travel planner"
requires-python = "==3.12.*"
dependencies = [
    "aiosmtplib==5.1.3",
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "asyncpg==0.32.0",
    "email-validator==2.3.0",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "langchain-core==1.7.3",
    "langchain-groq==1.1.3",
    "langgraph==1.2.18",
    "langsmith==0.14.16",
    "PyJWT==2.15.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.2",
    "redis[hiredis]==8.1.0",
    "SQLAlchemy[asyncio]==2.1.6",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
